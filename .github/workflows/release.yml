name: Release

# 手动触发或推 v* 标签：在 GitHub 上编译签名安装包并发布 Release，
# 同时生成 latest.json 供应用内自动更新。签名密钥来自仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY          私钥内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 空字符串（无密码密钥）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 签名密钥就位后 tauri build 自动产出 *.sig 与 updater 工件。
      - name: Build and bundle installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # NSIS 与 MSI 双格式都要签名，latest.json 的两个平台条目都要读。
      - name: Generate updater manifest
        shell: bash
        run: node scripts/release/make-latest-json.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trade-island-release
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
